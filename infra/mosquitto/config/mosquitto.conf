# Broker MQTT del PMV — Mosquitto 2.x
# Contrato del tópico: piscigranja/{codigo_estanque}/{parametro}

listener 1883 0.0.0.0

# Listener WebSocket para el navegador (HU-03: la alerta aparece sin recargar).
# El tablero se suscribe a piscigranja/alertas por este puerto; los servicios
# del backend siguen usando el listener TCP 1883.
listener 9001 0.0.0.0
protocol websockets

# Entorno local de desarrollo y pruebas: sin autenticación.
# La credencial por nodo sensor queda para el Incremento 2, junto con TLS.
allow_anonymous true

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
